<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order placed · {{ tenant.name }}</title>
    <style>
        body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#f6f7f9; color:#1a1a1a;
               display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.25rem; }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:2rem 1.5rem; max-width:420px; text-align:center; }
        .check { width:64px; height:64px; border-radius:50%; background:#dcfce7; color:#15803d; font-size:2rem;
                 display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; }
        h1 { font-size:1.3rem; margin:.25rem 0; }
        .ref { font-size:1.1rem; font-weight:700; margin:.5rem 0; }
        p { color:#6b7280; line-height:1.5; }
        a.again { display:inline-block; margin-top:1.25rem; color:#0f6a5d; font-weight:600; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Order placed</h1>
        <div class="ref">Reference #{{ order_id }}</div>
        {% if table %}<p>Table {{ table }}</p>{% endif %}
        <p>Thank you! {{ tenant.name }} has received your order and will confirm it shortly.</p>
        <a class="again" href="{{ url_for('order.order_page', tenant_id=tenant.id, table=table or none) }}">Place another order</a>
    </div>
</body>
</html>
