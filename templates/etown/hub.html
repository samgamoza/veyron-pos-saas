<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eTown — Shops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8fafc; }
        .etown-hero { background: linear-gradient(135deg, #0f766e, #134e4a); color: #fff; padding: 2rem 1rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="etown-hero text-center">
        <h1 class="h3 mb-2">eTown</h1>
        <p class="mb-0 small opacity-75">Local shops on BarrioOS — browse and place orders.</p>
    </div>
    <main class="container pb-5">
        {% if tenants %}
            <div class="row g-3">
                {% for t in tenants %}
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="h5 card-title">{{ t.name }}</h2>
                            <a class="btn btn-primary btn-sm" href="{{ url_for('etown.shop', tenant_id=t.id) }}">View shop</a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted">No marketplace shops are available yet.</p>
        {% endif %}
    </main>
</body>
</html>
